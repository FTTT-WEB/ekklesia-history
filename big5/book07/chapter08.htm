    <p align="center"><font face="標楷體" size="+3" color="#009966">第八章　Novatus 的異端 </font></p>
    <hr width="95%">
  </td>

  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">『因著正面的理由，我們憎惡Novatian<sup><a href="#8">[8]</a></sup>。因Novatian使教會分裂且把一些弟兄們帶到不信和褻瀆神，同時引進了對神不信的教訓，也毀謗我們這位滿有憐憫的主耶穌基督是不仁慈的。除此之外，Novatian否認神聖之浸<sup><a href="#9">[9]</a></sup>，推翻在受浸前當有信心和悔改的說法，全然地將聖靈排除在它們之外。事實上，對於Novatian會保留或轉向信心和悔改的想法是沒有任何希望的。』	
      </p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" colspan="2"> 
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="8"></a>[8]關於Novatus其人及其造成的風波，參第六卷第四十三章。</font></p>
    </td>
  </tr>
   <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="9"></a>[9]Cyprian曾指出，Novatian將一切來到他們面前的人都重新施浸。</font></p>
    </td>
  </tr>
