      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Astyrius也因著參與這些事的勇氣而被記念。他是個相當於議員階級的羅馬人，蒙皇帝喜悅，且因他貴族的出身和財富而聞名。Astyrius在殉道者受死現場時，會將殉道者的遺體背在肩上帶走，以華麗昂貴的衣服覆蓋殉道者，用慎重的態度預備墓地，給與合的和葬禮。這人的朋友至今還在我們中間，將與這人有關的事告訴我們。	
      </p>
