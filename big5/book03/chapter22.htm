<title>第二十二章　安提阿的第二位監督─以革那提 </title>
</head>
<body background="../../image/theme03_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966">第二十二章　安提阿的第二位監督─以革那提	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">安提阿首位監督Evodius過世後，以革那提被指派為第二位監督<sup><a href="#42">[42]</a></sup>。西面也在此時接續主的兄弟，成為第二位治理耶路撒冷教會的監督。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="42"></a>[42]	
        Origen也相信Evodius是安提阿教會的首位監督；但另有些教父如Athenasius或Chrysostome則直接將Ignatius列為第一位監督。</font></p>
    </td>
  </tr>
</table>
