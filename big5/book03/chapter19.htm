    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">這位多米田也下令屠殺大衛的子孫。照著古時的傳統說法，那時有些異端者指控猶大的後代(猶大是主肉身的兄弟)，因為他們是大衛的家室，又與基督有關聯。Hegesippus在下列篇幅中記錄這事。</p>
