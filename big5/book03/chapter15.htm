    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">多米田十二年，Anencletus治理羅馬教會十二年後，革利免接下其職，成為羅馬的第三位監督。使徒保羅在《腓立比書》裏，曾提到他的同工革利免：「革利免、並我其餘的同工…他們的名字都在生命冊上。」(腓四3)</p>
