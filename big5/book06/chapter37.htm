    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">約在那時，Arabia有一些人興起，傳講一種異於真理的教訓。這些人宣稱，人的魂在今世死後會與身體一起毀壞，但在復活時會與身體同得更新。當時就有一場規模不小的會議因而舉行，Origen因受邀參加，就在會中針對此一問題公開發言，他的發言使這些人的錯誤觀點至終得以改正。
      </p>
