    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Clement接續Pantaenus，指導Alexandria的教理問答學院，當時仍是孩童的Origen，也是他的學生之一。Clement在他的《雜記》(Stromata)卷一中提供了一份年表，記事直到Commodus之死。可見這部作品是在Severus統治期間所寫的，而我們也正在記錄這個時代的事。
