<title>第二十四章　Origen在Alexandria所著的聖經評注 </title>
</head>
<body background="../../image/theme08_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966"> 第二十四章　Origen在Alexandria所著的聖經評注</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">我們最好附帶說明，Origen在他所寫的《約翰福音》釋義卷六中指出，這部書的前五卷是他在Alexandria編的。在他全部的福音書注釋中，我們只有二十二卷。
      </p>
    </td>
  </tr>  
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 3 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">他也在離開Alexandria前，寫了一部《原理》(De Principiis)；也完成一部名為《雜記》(Stromata)的言論集，內含十卷，是他於Alexander統治下在同一城市所寫。這是根據他自己在前言中所註記的。
      </p>
    </td>
  </tr>
</table>
