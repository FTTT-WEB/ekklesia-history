    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">當時Origen發覺，他已無法應付神聖事物上的研究、聖經的解釋，以及教導初學者的工作。學生從早到晚一個接著一個前來，要接受他的指導，使他被壓的喘不過氣來。因此他決定分班。他從熟識的人中選出Heraclas，使他作輔助教學的工作。這位Heraclas熱切學習神聖事物，是個精通哲學的博聞者。Origen將初學者的基礎課程交由他負責，而那些學習進階的人則留給自己來指導。
      </p>
