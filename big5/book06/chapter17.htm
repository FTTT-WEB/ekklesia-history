    <p align="center"><font face="標楷體" size="+3" color="#009966">第十七章　譯者Symmachus</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">在這些翻譯者當中，我們要特別說明，Symmachus是一個Ebionite。所謂的Ebionite異端，就是宣稱基督乃約瑟和馬利亞之子，僅僅是人而已。並且這派人士也強烈堅持，要照著猶太人的傳統來持守律法，正如我們先前在這部歷史中已介紹過的<sup><a href="chapter17.htm#51">[51]</a></sup>。在現存的Symmachus經文註釋中，他為了支持這異端而攻擊馬太福音。Origen表示他是透過某位Juliana取得這些Symmachus的經文註釋。而據Juliana的說法，他是直接從Symmachus手中接收了這些書籍。	
      </p>
    </td>
  </tr>
