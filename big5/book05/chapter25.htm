  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966"> 　第二十五章	眾人如何在逾越節的事上達成共識</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">我們前面所提過的Palestine監督Narcissus、Theophilus、Tyre教會的監督Cassius、Ptolemais教會的Clarus，和那些和他們來在一起的人，都說到他們從使徒所接續的逾越節傳統。他們在書信末了更進一步的說：『要盡力將這封信送到所有的教會，我們不會讓那些心思容易偏離的人有機可乘。然而我們也要告知你們，在Alexandria的人也和我們在同一天守這節。因我們寄信給他們，他們也寄給我們。所以我們現在於同樣的時候，以同樣的方式，持守這聖日。』
      </p>
