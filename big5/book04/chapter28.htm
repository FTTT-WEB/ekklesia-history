      <p style="line-height: 200%" align="left"> 1我們先前所提到的Musanus曾寫過一篇相當優美的文章，勸勉少數一度落到禁慾主義中的弟兄們。禁慾主義帶進禁戒嫁娶的嚴重錯誤，對後世造成非常負面的影響。據說禁慾主義的始祖就是Tatian。
