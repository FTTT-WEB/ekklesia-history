    <td colspan="2"> 
      <p align="center"><font face="標楷體" size="+3" color="#009966"> 第四章 在同一位皇帝時，亞歷山大與羅馬的監督	
        </font></p>
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"> Adrian執政第三年，羅馬監督Alexander辭世，結束長達十年的盡職。接續其位的是Xystus。約在此時，亞歷山大監督Primus也在他第十二年的任期中離世，由Justus接續其位<sup><a href="#7">[7]</a></sup>。	
      </p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" colspan="2"> 
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="7"></a>[7]雖然在Eusebius所得的資料中，每個教會的監督是唯一的。但事實上，後來在大公教會中普遍實行的單一主教制(monarchial 
        episcopate)，在當時根本還未成形。單一主教制並非新約聖經所原有，乃是後來才興起的作法。</font></p>
    </td>
  </tr>
