    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"> 根據Dionysius的書信，我們知道Philip是Gortyna教會的監督。他著有一本駁斥Marcion異端的經典之作。愛任紐以及Modestus也都看出Marcion的錯誤，後者並將其錯謬公諸於世。還有許多其他人的作品，也為弟兄們所保存，直到今日。	
      </p>
