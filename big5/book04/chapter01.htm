    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"> Trajan執政的第十二年，亞歷山大教會的監督Primus辭世。從最早被派盡職的使徒們算起，他乃是第四代監督。同時，Evarestus已任職羅馬教會監督八年；Alexander接續其監督職任，為彼得與保羅之後的第五代。	
      </p>
