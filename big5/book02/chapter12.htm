<title>第十章 在基督傳道時的猶太大祭司 </title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="標楷體" size="+3" color="#009966">第十二章 Osrhoenians<sup><a href="#29">[29]</a></sup>王后Helen</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left">『同時，猶大地發生了大飢荒，Helen王后用許多錢，從埃及買了糧食，分配給在猶大地的飢民。』</p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left">你也能在使徒行傳中，找到相符的陳述。那裏說到，在安提阿的門徒按其力量，決定每個人都濟助在猶太地的眾人。他們就這樣做了，派巴拿巴和保羅將賑災款送至長老們處。</p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <HR>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">&nbsp;</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="29"></a>[29]歷史學者說到，耶路撒冷城外稱作 
        Aelia 的地方，仍可見到Helen功績輝煌的紀念碑，但說她是 Adiabeni 的王后。</font></p>
    </td>
  </tr>
