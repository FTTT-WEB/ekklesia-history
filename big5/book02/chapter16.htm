<title>第十六章　馬可首次將福音傳給埃及的居民</title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966">第十六章　馬可首次將福音傳給埃及的居民</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">他們也提到<sup><a href="#40">[40]</a></sup>，馬可是第一位受差遣到埃及的使徒，宣揚他記錄下來的福音，並率先在亞歷山卓城建立教會。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">自此，大批信眾無論男女聚在一處，由於他們超乎想像的達觀修持和簡約生活，Philo 
        認為值得為他們留下記錄，包括他們的工作、集會和娛樂，簡言之，他們生活的一切方式。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp; </td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="40"></a>[40]這指明Eusebius也只是風聞此事馬可在埃及傳教之事，或是由Epiphanius、Jerome的著作中得到些許線索。只不過這些著作都是第三世紀單獨的史料，其模糊性與口述之傳統不相上下。</font></p>
    </td>
  </tr>
</table>
