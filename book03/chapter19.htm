    <td width="96%">
      <p style="line-height: 200%" align="left">这位多米田也下令屠杀大卫的子孙。照着古时的常规说法，那时有些异端者指控犹大的后代(犹大是主肉身的兄弟)，因为他们是大卫的家室，又与基督有关联。Hegesippus在下列篇幅中记录这事。</p>
