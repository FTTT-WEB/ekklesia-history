    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">多米田十二年，Anencletus治理罗马教会十二年后，革利免接下其职，成为罗马的第三位监督。使徒保罗在《腓立比书》里，曾提到他的同工革利免：「革利免、并我其余的同工…他们的名字都在生命册上。」(腓四3)</p>
