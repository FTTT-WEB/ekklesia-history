<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966">第十一章　西面〈Simeon〉接续雅各治理耶路撒冷教会。	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">雅各殉道，耶路撒冷紧接着沦陷。尚存的使徒、主的跟从者以及主的亲属自各地齐聚一堂。众人商议最佳的继任人选，共同推出福音书曾题到之革罗罢(Cleophas)<sup><a href="chapter11.htm#36">[36]</a></sup>的儿子─西面，来接任监督。他们说，根据Hegesippus的说法，革罗罢是约瑟的兄弟，那么西面便是主的堂兄弟。</p>
    </td>
  </tr>
