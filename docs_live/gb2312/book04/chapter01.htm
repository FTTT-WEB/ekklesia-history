    <td width="96%"> 
      <p style="line-height: 200%" align="left"> Trajan执政的第十二年，亚历山大教会的监督Primus辞世。从最早被派尽职的使徒们算起，他乃是第四代监督。同时，Evarestus已任职罗马教会监督八年；Alexander接续其监督职任，为彼得与保罗之后的第五代。
