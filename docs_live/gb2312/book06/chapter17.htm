  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">在这些翻译者当中，我们要特别说明，Symmachus是一个Ebionite。所谓的Ebionite异端，就是宣称基督乃约瑟和马利亚之子，仅仅是人而已。并且这派人士也强烈坚持，要照着犹太人的传统来持守律法，正如我们先前在这部历史中已介绍过的<sup><a href="chapter17.htm#51">[51]</a></sup>。在现存的Symmachus经文注释中，他为了支持这异端而攻击马太福音。Origen表示他是透过某位Juliana取得这些Symmachus的经文注释。而据Juliana的说法，他是直接从Symmachus手中接收了这些书籍。	
      </p>
