      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">他(Firmilianus)深受Origen所感，因此延请Origen来到他那里造就教会。甚至他还为了要在神圣的事物上求进步，亲自去Judea拜访Origen。此外，Jerusalem监督Alexander和Caesarea监督Theoctistus，也常常接待他，待他如尊师，请他讲解圣经，并执行教会讲道的职责。
      </p>
