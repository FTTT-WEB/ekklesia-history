<title>第二十二章　安提阿的第二位监督─以革那提 </title>
</head>
<body background="../../image/theme03_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966">第二十二章　安提阿的第二位监督─以革那提	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">安提阿首位监督Evodius过世后，以革那提被指派为第二位监督<sup><a href="chapter22.htm#42">[42]</a></sup>。西面也在此时接续主的兄弟，成为第二位治理耶路撒冷教会的监督。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="42"></a>[42]	
        Origen也相信Evodius是安提阿教会的首位监督；但另有些教父如Athenasius或Chrysostome则直接将Ignatius列为第一位监督。</font></p>
    </td>
  </tr>
