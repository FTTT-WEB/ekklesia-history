    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Astyrius也因着参与这些事的勇气而被记念。他是个相当於议员阶级的罗马人，蒙皇帝喜悦，且因他贵族的出身和财富而闻名。Astyrius在殉道者受死现场时，会将殉道者的遗体背在肩上带走，以华丽昂贵的衣服覆盖殉道者，用慎重的态度预备墓地，给与合的和葬礼。这人的朋友至今还在我们中间，将与这人有关的事告诉我们。	
      </p>
