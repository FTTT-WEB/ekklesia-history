      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">神教会的仇敌是所有良善之事的大仇敌，它鼓动人作恶，无所不用其极的用各种计谋反抗人。他又再度活跃起来，引发新的异端，使之盛行以反对教会。在这些人当中，有些就像毒蛇一样，爬遍亚西亚和弗吕家，他们妄言Montanus是保惠师(Paraclete)，而跟从他的那两位女人，Priscilla和Maximilla，是Montanus的女先知。
      </p>
