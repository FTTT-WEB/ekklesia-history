    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Narcissus遁隱以後，無人知其去向。在鄰近教會治理的人認為，應該任命另一位監督。這位監督名為Dius。他只管理教會一段很短的時間，之後就由Germanio繼承。之後又由Gordius繼承監督職位。此時，Narcissus再次出現，如同從死人中復活一樣。弟兄們立即請求他重新擔任主教職位，因他的退隱、他的哲理並因神為他申冤的審判，使他更加令人欽佩。	
      </p>
