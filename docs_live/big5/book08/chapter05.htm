<title>第五章　在Nicomedia的那些人</title>
</head>
<body background="../../image/theme07_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="標楷體" size="+3" color="#009966">第五章　在Nicomedia的那些人 </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">當敵擋Nicomedia眾教會的詔令一頒佈，有一位因具備高尚品格而受到高度敬重的人士，向神發熱心，受感並在光明正大的信仰中受激動，將那向眾人公佈的詔書取下，當作褻瀆、邪惡之物撕碎。當他作這事時，該城兩位掌權者也在，其中一位是最老資格的，另一位是在他之後位居第四高位。
      </p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 2 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">這個人乃是頭一位，他因為這麼顯眼的行逕，作完這大膽的事，隨後就遭受苦難。他到死為止，都維持他靈裡的喜樂和平靜。
      </p>
    </td>
  </tr>
</table>
