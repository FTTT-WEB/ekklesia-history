      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">為了引導您閱讀本書『初期教會歷史』，我們盡力地提供必要的細節，包括那『救恩之道』的神性及我們所教訓信條的古風，如基督徒所活傳揚福音的生活。這些細節連同基督末了幾年的為人生活、受苦、選立使徒等境遇，我們在前一章各個簡約的主題中已討論並舉證過了。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">這裏，我們將檢視基督升天後的情景，並從聖經，必要時也由其他參考文獻申述之。</p>
    </td>
  </tr>
