<title>第八章 革老丟（Claudius） 統治時的飢荒</title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966">第八章 革老丟（Claudius） 
      統治時的飢荒</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">1 Caius 在位不到四年，革老丟（Claudius）繼位，統治羅馬帝國。當他統治時，飢荒蔓延全地。關於這事，歷史學家遺留下來的記錄，卻是與我們的信條相去甚遠；使徒行傳乃是說到申言者亞迦布（Agalus） 
        豫言了一個突然臨到全地的飢荒，得了應驗<sup><a href="chapter08.htm#23">[23]</a></sup>。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">2 路加記載革老丟在位時的飢荒，並安提阿的弟兄們，依個人的度量奉獻，託保羅和巴拿巴將捐項送至猶太各地，接著在行傳中作了以下的記錄。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp; </td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="23"></a>[23]參行傳十一章</font></p>
    </td>
  </tr>
