<title>第十一章　西面〈Simeon〉接續雅各治理耶路撒冷教會。 </title>
</head>
<body background="../../image/theme03_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966">第十一章　西面〈Simeon〉接續雅各治理耶路撒冷教會。	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">雅各殉道，耶路撒冷緊接著淪陷。尚存的使徒、主的跟從者以及主的親屬自各地齊聚一堂。眾人商議最佳的繼任人選，共同推出福音書曾題到之革羅罷(Cleophas)<sup><a href="chapter11.htm#36">[36]</a></sup>的兒子─西面，來接任監督。他們說，根據Hegesippus的說法，革羅罷是約瑟的兄弟，那麼西面便是主的堂兄弟。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>

      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="36"></a>[36]	
        約十九25</font></p>
