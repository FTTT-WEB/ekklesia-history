<title>第二十一章　亞歷山卓城第三位監督Cerdon </title>
</head>
<body background="../../image/theme03_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="標楷體" size="+3" color="#009966">第二十一章　亞歷山卓城第三位監督Cerdon	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Nerva在位一年多以後，圖拉真(Trajan)繼承王位。圖拉真元年，Avilius在治理教會十三年後，由Cerdon接續其職，成為亞歷山卓城第三位監督。此時，革利免接替了在保羅同彼得<sup><a href="chapter21.htm#41">[41]</a></sup>以後的第一任監督利奴與第二任監督Anencletus，成為羅馬教會的第三位監督。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="41"></a>[41]	
        Eusebius應認為兩人同時擔任羅馬教會的監督</font></p>
    </td>
  </tr>
</table>
