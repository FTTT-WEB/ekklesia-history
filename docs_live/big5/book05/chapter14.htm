  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">神教會的仇敵是所有良善之事的大仇敵，牠鼓動人作惡，無所不用其極的用各種計謀反抗人。他又再度活躍起來，引發新的異端，使之盛行以反對教會。在這些人當中，有些就像毒蛇一樣，爬遍亞西亞和弗呂家，他們妄言Montanus是保惠師(Paraclete)，而跟從他的那兩位女人，Priscilla和Maximilla，是Montanus的女先知。
      </p>
