      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Cornelius在羅馬任職主教約三年。隨後由Lucius繼任，不到八個月，他就去世，職位由Stephen接任。Dionysius在寫給Stephen的第一封提到關於受浸的信中，並沒有任何爭論，正如那時對於從各種異端中回轉過來的人是否該藉著受浸得潔淨，也沒有爭論一樣。因為從古時候的習俗來看，這些回轉的人只需接受按手禱告。
      </p>
