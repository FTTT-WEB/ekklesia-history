<title>第二十九章　保羅被一位出身詭辯學派的長老Malchion駁倒後遭革除</title>
</head>
<body background="../../image/theme06_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="標楷體" size="+3" color="#009966">第二十九章　保羅被一位出身詭辯學派的長老Malchion駁倒後遭革除</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Aurelian在位時，由大批主教組成的會議最後一次召開，在安提阿的異端領袖保羅被看穿，他的錯誤教訓被公諸於世，因次他就被普天下之大公教會革除。
      </p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 2 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Malchion特特把保羅從藏身處拖出來，並駁倒他。Malchion乃一博學之人，是在安提阿希臘詭辯學派校長，但因他在基督裡美好的信，而被立為該區的長老。Malchion與保羅進行會談，他們的談話由速記員記錄下來。而這份記錄就我們所知還存在，單憑這份記錄就可以查出誰在隱瞞並欺騙人。
      </p>
    </td>
  </tr>
</table>
