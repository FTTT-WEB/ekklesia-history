<title>第二十四章　Origen在Alexandria所着的圣经评注 </title>
</head>
<body background="../theme08_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966"> 第二十四章　Origen在Alexandria所着的圣经评注</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">我们最好附带说明，Origen在他所写的《约翰福音》释义卷六中指出，这部书的前五卷是他在Alexandria编的。在他全部的福音书注释中，我们只有二十二卷。
      </p>
    </td>
  </tr>  
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 3 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">他也在离开Alexandria前，写了一部《原理》(De Principiis)；也完成一部名为《杂记》(Stromata)的言论集，内含十卷，是他於Alexander统治下在同一城市所写。这是根据他自己在前言中所注记的。
      </p>
    </td>
  </tr>
</table>
