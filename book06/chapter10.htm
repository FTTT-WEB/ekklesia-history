    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Narcissus遁隐以後，无人知其去向。在邻近教会治理的人认为，应该任命另一位监督。这位监督名为Dius。他只管理教会一段很短的时间，之後就由Germanio继承。之後又由Gordius继承监督职位。此时，Narcissus再次出现，如同从死人中复活一样。弟兄们立即请求他重新担任主教职位，因他的退隐、他的哲理并因神为他申冤的审判，使他更加令人钦佩。	
      </p>
