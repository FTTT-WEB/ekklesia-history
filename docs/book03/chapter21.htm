<title>第二十一章　亚历山卓城第三位监督Cerdon </title>
</head>
<body background="../theme03_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966">第二十一章　亚历山卓城第三位监督Cerdon	
      </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Nerva在位一年多以后，图拉真(Trajan)继承王位。图拉真元年，Avilius在治理教会十三年后，由Cerdon接续其职，成为亚历山卓城第三位监督。此时，革利免接替了在保罗同彼得<sup><a href="chapter21.htm#41">[41]</a></sup>以后的第一任监督利奴与第二任监督Anencletus，成为罗马教会的第三位监督。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="41"></a>[41]	
        Eusebius应认为两人同时担任罗马教会的监督</font></p>
    </td>
  </tr>
