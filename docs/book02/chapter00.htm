    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">为了引导您阅读本书『初期教会历史』，我们尽力地提供必要的细节，包括那『救恩之道』的神性及我们所教训信条的古风，如基督徒所活传扬福音的生活。这些细节连同基督末了几年的为人生活、受苦、选立使徒等境遇，我们在前一章各个简约的主题中已讨论并举证过了。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">这里，我们将检视基督升天后的情景，并从圣经，必要时也由其他参考文献申述之。</p>
    </td>
