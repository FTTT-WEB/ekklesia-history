    <p align="center"><font face="标楷体" size="+3" color="#009966"> 　第二十五章	众人如何在逾越节的事上达成共识</font></p>
    <hr width="95%">
  </td>

  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">我们前面所提过的Palestine监督Narcissus、Theophilus、Tyre教会的监督Cassius、Ptolemais教会的Clarus，和那些和他们来在一起的人，都说到他们从使徒所接续的逾越节传统。他们在书信末了更进一步的说：『要尽力将这封信送到所有的教会，我们不会让那些心思容易偏离的人有机可乘。然而我们也要告知你们，在Alexandria的人也和我们在同一天守这节。因我们寄信给他们，他们也寄给我们。所以我们现在於同样的时候，以同样的方式，持守这圣日。』
      </p>
