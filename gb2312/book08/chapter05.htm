<title>第五章　在Nicomedia的那些人</title>
</head>
<body background="../../image/theme07_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="标楷体" size="+3" color="#009966">第五章　在Nicomedia的那些人 </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">当敌挡Nicomedia众教会的诏令一颁布，有一位因具备高尚品格而受到高度敬重的人士，向神发热心，受感并在光明正大的信仰中受激动，将那向众人公布的诏书取下，当作亵渎、邪恶之物撕碎。当他作这事时，该城两位掌权者也在，其中一位是最老资格的，另一位是在他之後位居第四高位。
      </p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 2 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">这个人乃是头一位，他因为这麽显眼的行迳，作完这大胆的事，随後就遭受苦难。他到死为止，都维持他灵里的喜乐和平静。
      </p>
    </td>
  </tr>
</table>
