    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"> 根据Dionysius的书信，我们知道Philip是Gortyna教会的监督。他着有一本驳斥Marcion异端的经典之作。爱任纽以及Modestus也都看出Marcion的错误，后者并将其错谬公诸于世。还有许多其他人的作品，也为弟兄们所保存，直到今日。	
      </p>
