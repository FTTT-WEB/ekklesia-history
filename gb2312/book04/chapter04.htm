    <td colspan="2"> 
      <p align="center"><font face="标楷体" size="+3" color="#009966"> 第四章 在同一位皇帝时，亚历山大与罗马的监督	
        </font></p>
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"> Adrian执政第三年，罗马监督Alexander辞世，退出长达十年的尽职。接续其位的是Xystus。约在此时，亚历山大监督Primus也在他第十二年的任期中离世，由Justus接续其位<sup><a href="chapter04.htm#7">[7]</a></sup>。	
      </p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" colspan="2"> 
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="7"></a>[7]虽然在Eusebius所得的资料中，每个教会的监督是唯一的。但事实上，后来在大公教会中普遍实行的单一主教制(monarchial 
        episcopate)，在当时根本还未成形。单一主教制并非新约圣经所原有，乃是后来才兴起的作法。</font></p>
    </td>
  </tr>
