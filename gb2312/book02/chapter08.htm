<title>第八章 革老丢（Claudius） 统治时的饥荒</title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966">第八章 革老丢（Claudius） 
      统治时的饥荒</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">1 Caius 在位不到四年，革老丢（Claudius）继位，统治罗马帝国。当他统治时，饥荒蔓延全地。关于这事，历史学家遗留下来的记录，却是与我们的信条相去甚远；使徒行传乃是说到申言者亚迦布（Agalus） 
        豫言了一个突然临到全地的饥荒，得了应验<sup><a href="chapter08.htm#23">[23]</a></sup>。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">2 路加记载革老丢在位时的饥荒，并安提阿的弟兄们，依个人的度量奉献，托保罗和巴拿巴将捐项送至犹太各地，接着在行传中作了以下的记录。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp; </td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="23"></a>[23]参行传十一章</font></p>
    </td>
  </tr>
