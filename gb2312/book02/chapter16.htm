<title>第十六章　马可首次将福音传给埃及的居民</title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2">
    <p align="center"><font face="标楷体" size="+3" color="#009966">第十六章　马可首次将福音传给埃及的居民</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">他们也提到<sup><a href="chapter16.htm#40">[40]</a></sup>，马可是第一位受差遣到埃及的使徒，宣扬他记录下来的福音，并率先在亚历山卓城创建教会。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">自此，大批信众无论男女聚在一处，由于他们超乎想像的达观修持和简约生活，Philo 
        认为值得为他们留下记录，包括他们的工作、集会和娱乐，简言之，他们生活的一切方式。</p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" colspan="2">
      <p style="line-height: 200%" align="left">
      <hr width="95%">
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">&nbsp; </td>
    <td width="96%">
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="40"></a>[40]这指明Eusebius也只是风闻此事马可在埃及传教之事，或是由Epiphanius、Jerome的着作中得到些许线索。只不过这些着作都是第三世纪单独的史料，其模糊性与口述之常规不相上下。</font></p>
    </td>
  </tr>
</table>
