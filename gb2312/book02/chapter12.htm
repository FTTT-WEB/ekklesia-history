<title>第十章 在基督传道时的犹太大祭司 </title>
</head>
<body background="../../image/theme02_main.jpg" bgproperties="fixed">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="标楷体" size="+3" color="#009966">第十二章 Osrhoenians<sup><a href="chapter12.htm#29">[29]</a></sup>王后Helen</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">1</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left">『同时，犹大地发生了大饥荒，Helen王后用许多钱，从埃及买了粮食，分配给在犹大地的饥民。』</p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">2</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left">你也能在使徒行传中，查找相符的陈述。那里说到，在安提阿的门徒按其力量，决定每个人都济助在犹太地的众人。他们就这样做了，派巴拿巴和保罗将赈灾款送至长老们处。</p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%">
      <HR>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%"> 
      <p style="line-height: 200%" align="left">&nbsp;</p>
    </td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="29"></a>[29]历史学者说到，耶路撒冷城外称作 
        Aelia 的地方，仍可见到Helen功绩辉煌的纪念碑，但说她是 Adiabeni 的王后。</font></p>
    </td>
  </tr>
