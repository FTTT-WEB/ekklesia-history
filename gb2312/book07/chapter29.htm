<title>第二十九章　保罗被一位出身诡辩学派的长老Malchion驳倒後遭革除</title>
</head>
<body background="../../image/theme06_main.jpg" bgproperties="fixed" bgcolor="#ffffff">
<table width="90%" border="0" align="center">
  <td colspan="2"> 
    <p align="center"><font face="标楷体" size="+3" color="#009966">第二十九章　保罗被一位出身诡辩学派的长老Malchion驳倒後遭革除</font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Aurelian在位时，由大批主教组成的会议最後一次召开，在安提阿的异端领袖保罗被看穿，他的错误教训被公诸於世，因次他就被普天下之大公教会革除。
      </p>
    </td>
  </tr>
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 2 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Malchion特特把保罗从藏身处拖出来，并驳倒他。Malchion乃一博学之人，是在安提阿希腊诡辩学派校长，但因他在基督里美好的信，而被立为该区的长老。Malchion与保罗进行会谈，他们的谈话由速记员记录下来。而这份记录就我们所知还存在，单凭这份记录就可以查出谁在隐瞒并欺骗人。
      </p>
    </td>
  </tr>
</table>
