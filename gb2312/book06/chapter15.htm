      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">当时Origen发觉，他已无法应付神圣事物上的研究、圣经的解释，以及教导初学者的工作。学生从早到晚一个接着一个前来，要接受他的指导，使他被压的喘不过气来。因此他决定分班。他从熟识的人中选出Heraclas，使他作辅助教学的工作。这位Heraclas热切学习神圣事物，是个精通哲学的博闻者。Origen将初学者的基础课程交由他负责，而那些学习进阶的人则留给自己来指导。
      </p>
