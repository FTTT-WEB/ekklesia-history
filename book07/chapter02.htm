    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">Cornelius在罗马任职主教约叁年。随後由Lucius继任，不到八个月，他就去世，职位由Stephen接任。Dionysius在写给Stephen的第一封提到关於受浸的信中，并没有任何争论，正如那时对於从各种异端中回转过来的人是否该藉着受浸得洁净，也没有争论一样。因为从古时候的习俗来看，这些回转的人只需接受按手祷告。
      </p>
