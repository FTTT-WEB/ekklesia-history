<title>第八章　Novatus 的异端 </title>
</head>

  <td colspan="2"> 
    <p align="center"><font face="标楷体" size="+3" color="#009966">第八章　Novatus 的异端 </font></p>
    <hr width="95%">
  </td>
  </tr>
  <tr> 
  <tr>
    <td align="left" valign="top" width="4%">
      <p style="line-height: 200%" align="left"> 1 </p>
    </td>
    <td width="96%">
      <p style="line-height: 200%" align="left">『因着正面的理由，我们憎恶Novatian<sup><a href="chapter08.htm#8">[8]</a></sup>。因Novatian使教会分裂且把一些弟兄们带到不信和亵渎神，同时引进了对神不信的教训，也毁谤我们这位满有怜悯的主耶稣基督是不仁慈的。除此之外，Novatian否认神圣之浸<sup><a href="chapter08.htm#9">[9]</a></sup>，推翻在受浸前当有信心和悔改的说法，全然地将圣灵排除在它们之外。事实上，对於Novatian会保留或转向信心和悔改的想法是没有任何希望的。』	
      </p>
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" colspan="2"> 
      <hr width="95%">
    </td>
  </tr>
  <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="8"></a>[8]关於Novatus其人及其造成的风波，参第六卷第四十叁章。</font></p>
    </td>
  </tr>
   <tr> 
    <td align="left" valign="top" width="4%">&nbsp;</td>
    <td width="96%"> 
      <p style="line-height: 200%" align="left"><font color="#FF0001"><a name="9"></a>[9]Cyprian曾指出，Novatian将一切来到他们面前的人都重新施浸。</font></p>
    </td>
  </tr>
